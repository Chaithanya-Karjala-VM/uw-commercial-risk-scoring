services:
  - type: web
    name: assisted-underwriting-uw-workbench
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt -r webapp/requirements-web.txt"
    startCommand: "uvicorn webapp.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
